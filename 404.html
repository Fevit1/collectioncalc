<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Slab Worthy™</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- 404.html (2026-09-20). Its EXISTENCE is the fix: Cloudflare Pages treats a site with no
         top-level 404.html as a single-page app and answers every unknown path with index.html and
         a 200 — so /sitemap.xml "existed", and a crawler would have indexed the homepage under any
         URL it guessed. With this file present, unknown paths return a real 404. Self-contained on
         purpose (styles copied from offline.html): it must render whatever else failed. -->
    <style>
        :root { --purple: #7c3aed; --purple-light: #a855f7; --gold: #facc15; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #0f0f23; color: #fff; padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            text-align: center;
        }
        .wrap { max-width: 420px; }
        .logo {
            font-size: 2rem; font-weight: 700; letter-spacing: 1px;
            color: var(--gold); margin-bottom: 4px;
        }
        .tag { color: #a1a1aa; font-size: 0.85rem; margin-bottom: 32px; }
        h1 { font-size: 1.35rem; margin-bottom: 12px; }
        p { color: #d4d4d8; line-height: 1.6; margin-bottom: 12px; font-size: 0.95rem; }
        .note { color: #71717a; font-size: 0.8rem; margin-top: 24px; }
        a.btn {
            display: inline-block; text-decoration: none;
            margin-top: 24px; padding: 13px 32px; font-size: 1rem; font-weight: 600;
            color: #fff; border: none; border-radius: 8px; cursor: pointer;
            background: linear-gradient(135deg, var(--purple), var(--purple-light));
        }
        a.btn:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo">$LAB WORTHY&trade;</div>
        <div class="tag">AI for Collectors</div>

        <h1>We can't find that page</h1>
        <p>The address may be mistyped, or the page may have moved.</p>

        <a class="btn" href="/">Go to the homepage</a>

        <p class="note">Checking a comic's registration? <a href="/verify" style="color:#a855f7;">Verify by serial number</a>.</p>
    </div>
</body>
</html>
